name: CI
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build app
    runs-on: ubuntu-24.04
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' && secrets.ALIAS != '' && secrets.KEY_STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Build app
        run: ./gradlew assembleStandardRelease

      # Sign all builds with the same configured release keystore, including push builds.
      - name: Get tag name
        if: github.event.inputs.version != ''
        run: |
          set -x
          echo "VERSION_TAG=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Detect installed build-tools version
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          BTV=$(ls -1 "${ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -1)
          echo "Using build-tools $BTV"
          echo "BUILD_TOOLS_VERSION=$BTV" >> $GITHUB_ENV

      - name: Sign APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/standard/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      # Push builds publish installable, signed APKs to a single rolling pre-release.
      # This keeps APKs out of GitHub Actions artifact storage.
      - name: Require signing credentials
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error::SIGNING_KEY, ALIAS, KEY_STORE_PASSWORD and KEY_PASSWORD must be configured to publish installable APKs."
          exit 1

      - name: Prepare development Release assets
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          for variant in universal arm64-v8a armeabi-v7a x86 x86_64; do
            source="app/build/outputs/apk/standard/release/app-standard-${variant}-release-unsigned-signed.apk"
            test -s "$source" || { echo "::error::Missing signed APK: $source"; exit 1; }
            cp "$source" "release-apks/tachiyomij2k-${variant}.apk"
          done
          (cd release-apks && sha256sum *.apk > SHA256SUMS)

      - name: Publish latest development Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: dev-latest
          target_commitish: ${{ github.sha }}
          name: TachiyomiJ2K Development (latest)
          body: |
            Automatically updated signed development build from the master branch.
            Commit: ${{ github.sha }}
            Download tachiyomij2k-universal.apk for general Android devices.
            SHA-256 checksums are provided in SHA256SUMS.
            This release is a rolling pre-release, not a stable version.
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # target_commitish is only used when a tag is first created. Move the
      # existing rolling tag too so its source link matches the newest APKs.
      - name: Move development tag to built commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev-latest" \
            -f sha="${GITHUB_SHA}" -F force=true

      - name: Clean up build artifacts
        if: env.VERSION_TAG != '' && env.HAS_SIGNING_KEY == 'true'
        run: |
          set -e

          mv app/build/outputs/apk/standard/release/app-standard-universal-release-unsigned-signed.apk tachiyomij2k-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum tachiyomij2k-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_UNIVERSAL_SHA=$sha" >> $GITHUB_ENV

          cp app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release-unsigned-signed.apk tachiyomij2k-arm64-v8a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum tachiyomij2k-arm64-v8a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARM64_V8A_SHA=$sha" >> $GITHUB_ENV

          cp app/build/outputs/apk/standard/release/app-standard-armeabi-v7a-release-unsigned-signed.apk tachiyomij2k-armeabi-v7a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum tachiyomij2k-armeabi-v7a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARMEABI_V7A_SHA=$sha" >> $GITHUB_ENV

          cp app/build/outputs/apk/standard/release/app-standard-x86-release-unsigned-signed.apk tachiyomij2k-x86-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum tachiyomij2k-x86-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_SHA=$sha" >> $GITHUB_ENV

          cp app/build/outputs/apk/standard/release/app-standard-x86_64-release-unsigned-signed.apk tachiyomij2k-x86_64-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum tachiyomij2k-x86_64-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_64_SHA=$sha" >> $GITHUB_ENV

      - name: Create Release
        if: env.VERSION_TAG != '' && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: TachiyomiJ2K ${{ env.VERSION_TAG }}
          body: |
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }}
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }}
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }}
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |
          files: |
            tachiyomij2k-${{ env.VERSION_TAG }}.apk
            tachiyomij2k-arm64-v8a-${{ env.VERSION_TAG }}.apk
            tachiyomij2k-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            tachiyomij2k-x86-${{ env.VERSION_TAG }}.apk
            tachiyomij2k-x86_64-${{ env.VERSION_TAG }}.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
