name: Cloud sync verification
on:
  # Automatic ARM builds already compile and test sync changes.
  workflow_dispatch:

concurrency:
  group: cloud-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle configuration
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Compile standard release
        run: ./gradlew :app:compileStandardReleaseKotlin --no-daemon --stacktrace
