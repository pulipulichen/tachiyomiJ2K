name: Cloud sync verification
on:
  pull_request:
    branches: [master]
    paths:
      - 'app/src/main/java/eu/kanade/tachiyomi/data/sync/**'
      - 'app/src/main/java/eu/kanade/tachiyomi/ui/setting/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle.kts'
      - '.github/workflows/cloud-sync-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle configuration
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Compile standard release
        run: ./gradlew :app:compileStandardReleaseKotlin --no-daemon --stacktrace
